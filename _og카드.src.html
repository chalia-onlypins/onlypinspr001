<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og 카드 아트보드 1200x630</title>
<style>
  /* ⚠️ 이 파일은 화면용이 아니라 «아트보드»다. _og렌더.cjs 가 1200x630 으로 캡처한다.
     기존 광고카드(광고카드_20260811/)는 「최저가」가 박혀 있어 이 랜딩에 못 쓴다 — 그래서 따로 만든다. */
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    width:1200px; height:630px; overflow:hidden;
    font-family:"Pretendard","Pretendard Variable",system-ui,-apple-system,
                "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    word-break:keep-all; letter-spacing:-.03em;
    background:
      radial-gradient(90% 120% at 88% -10%, rgba(255,138,61,.34) 0%, rgba(255,138,61,0) 55%),
      linear-gradient(158deg,#fff8f3 0%, #fdfaf7 60%);
    color:#17120e; position:relative;
  }
  .board{display:flex; height:100%; padding:64px 68px; gap:48px; align-items:center}
  .left{flex:1; min-width:0}

  .brand{display:flex; align-items:center; gap:12px; margin-bottom:34px}
  .brand img{width:46px; height:46px; border-radius:12px; display:block}
  .brand .nm{font-size:24px; font-weight:800; letter-spacing:-.04em}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:19px; font-weight:800; color:#c2410c;
    background:#fff; border:1.5px solid #ffd0b3;
    padding:9px 19px; border-radius:999px; margin-bottom:24px;
  }
  .eyebrow .dot{width:7px; height:7px; border-radius:50%; background:#f2560a}

  h1{font-size:63px; line-height:1.2; font-weight:800; letter-spacing:-.045em}
  h1 .hl{background:linear-gradient(180deg,transparent 58%, rgba(255,138,61,.36) 58%); padding:0 3px}
  h1 .o{color:#f2560a}
  .sub{font-size:24px; color:#3b332d; line-height:1.6; margin-top:22px; font-weight:500}
  .sub b{font-weight:800}

  .chips{display:flex; gap:9px; margin-top:30px; flex-wrap:wrap}
  .c{
    font-size:18px; font-weight:700; color:#3b332d;
    background:#fff; border:1.5px solid #e2d7ce;
    padding:9px 17px; border-radius:999px;
  }
  .c.on{background:#17120e; border-color:#17120e; color:#fff}

  .right{flex:none; width:296px; display:flex; flex-direction:column; gap:13px}
  .gv{
    background:#fff; border:1.5px solid #efe7e0; border-radius:16px;
    padding:15px 18px; position:relative; overflow:hidden;
    box-shadow:0 2px 4px rgba(23,18,14,.04), 0 14px 30px -16px rgba(23,18,14,.2);
  }
  .gv::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:linear-gradient(180deg,#ff8a3d,#f2560a)}
  .gv .n{font-size:21px; font-weight:800; letter-spacing:-.04em}
  .gv .k{font-size:15px; color:#8b8078; font-weight:600; margin-top:3px}
</style>
</head>
<body>
  <div class="board">
    <div class="left">
      <div class="brand">
        <img src="{{LOGO}}" alt="">
        <span class="nm">온리핀스</span>
      </div>

      <span class="eyebrow"><span class="dot"></span>간편결제 · 계좌에서 바로</span>

      <h1>카드 없이<br><span class="hl">간편결제로 상품권</span><span class="o">.</span></h1>

      <p class="sub">
        결제가 끝나면 <b>1~2분 안에</b> PIN·교환권이 문자로.<br>
        구매·발송은 24시간 자동입니다.
      </p>

      <div class="chips">
        <span class="c on">간편결제</span>
        <span class="c">24시간 자동</span>
        <span class="c">본인확인 4단계</span>
      </div>
    </div>

    <div class="right">
      <div class="gv"><div class="n">북앤라이프</div><div class="k">도서문화상품권</div></div>
      <div class="gv"><div class="n">컬쳐랜드</div><div class="k">문화상품권</div></div>
      <div class="gv"><div class="n">신세계</div><div class="k">모바일상품권</div></div>
      <div class="gv"><div class="n">롯데백화점</div><div class="k">모바일상품권</div></div>
    </div>
  </div>
</body>
</html>
